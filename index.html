<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090b10">
    <title>VarioGuard AI - Bilingual & Gender Voice</title>
    <style>
        :root {
            --bg-dark: #090b10;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --safe-color: #00f59b;
            --warn-color: #ffb800;
            --danger-color: #ff2a55;
            --text-main: #f3f5f8;
            --text-muted: #8b95a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top, #131826 0%, var(--bg-dark) 75%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 16px 32px;
            overflow-x: hidden;
        }

        /* --- LOADING / SPLASH SCREEN --- */
        #loadingScreen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #141b2d 0%, #07090d 85%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: opacity 0.55s ease, visibility 0.55s ease;
        }

        #loadingScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 3px solid rgba(0, 245, 155, 0.12);
            border-top-color: var(--safe-color);
            border-right-color: #3b82f6;
            animation: spin 1s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 28px rgba(0, 245, 155, 0.25);
        }

        .loader-core {
            font-size: 1.6rem;
            animation: pulse 1.2s ease-in-out infinite alternate;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            from { transform: scale(0.9); opacity: 0.7; }
            to { transform: scale(1.12); opacity: 1; }
        }

        .loader-title {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #00f59b, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loader-bar-wrap {
            width: 210px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f59b, #3b82f6);
            transition: width 0.25s ease;
        }

        .loader-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        /* --- MAIN APP CONTAINER --- */
        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 2px;
            gap: 8px;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lang-toggle:active {
            background: rgba(255, 255, 255, 0.18);
        }

        .status-pill {
            font-size: 0.72rem;
            padding: 5px 10px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
        }

        .dot.active { background: var(--safe-color); box-shadow: 0 0 8px var(--safe-color); }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        .speed-card {
            text-align: center;
            padding: 28px 20px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .speed-card.state-safe { border-color: rgba(0, 245, 155, 0.35); }
        .speed-card.state-warn { border-color: rgba(255, 184, 0, 0.6); box-shadow: 0 0 25px rgba(255, 184, 0, 0.15); }
        .speed-card.state-danger { border-color: rgba(255, 42, 85, 0.8); box-shadow: 0 0 32px rgba(255, 42, 85, 0.28); }

        .speed-value {
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--safe-color);
            transition: color 0.25s ease;
        }

        .speed-unit {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 6px;
            font-weight: 600;
        }

        .ai-badge {
            margin-top: 16px;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(0, 245, 155, 0.12);
            color: var(--safe-color);
        }

        .bg-badge {
            margin-top: 8px;
            display: block;
            font-size: 0.75rem;
            color: #60a5fa;
        }

        .metrics-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .metric-box span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .metric-box strong {
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .limit-badge {
            font-weight: 700;
            color: var(--warn-color);
            font-size: 1.05rem;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--safe-color);
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 5px;
        }

        .preset-btns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 4px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f59b, #00b874);
            color: #05140e;
        }

        .btn-stop {
            background: linear-gradient(135deg, #ff2a55, #c9183c);
            color: #fff;
        }

        .btn-ble {
            background: rgba(59, 130, 246, 0.16);
            border: 1px solid rgba(59, 130, 246, 0.45);
            color: #60a5fa;
        }

        .btn-sim {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.82rem;
            padding: 11px;
        }

        .log-box {
            font-family: monospace;
            font-size: 0.74rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.35);
            padding: 10px 12px;
            border-radius: 12px;
            max-height: 85px;
            overflow-y: auto;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<!-- LOADING / SPLASH SCREEN -->
<div id="loadingScreen">
    <div class="loader-ring">
        <div class="loader-core">⚡</div>
    </div>
    <div class="loader-title">VarioGuard AI</div>
    <div class="loader-bar-wrap">
        <div class="loader-bar" id="loaderBar"></div>
    </div>
    <div class="loader-sub" id="loaderText">Initializing AI Telemetry...</div>
</div>

<!-- MAIN DASHBOARD -->
<div class="container">
    <div class="header">
        <div class="brand">⚡ VarioGuard AI</div>
        <div class="header-right">
            <button class="lang-toggle" id="langBtn" onclick="toggleLanguage()">🌐 ID (♀)</button>
            <div class="status-pill">
                <span class="dot" id="gpsDot"></span>
                <span id="gpsStatusText">GPS Stand-by</span>
            </div>
        </div>
    </div>

    <div class="glass-card speed-card state-safe" id="speedCard">
        <div class="speed-value" id="speedDisplay">0</div>
        <div class="speed-unit" id="unitLabel">KM / JAM</div>
        <div class="ai-badge" id="aiStatusBadge">AI Siap • Mode Mandiri</div>
        <span class="bg-badge" id="bgStatusText">Notifikasi & Background: Off</span>

        <div class="metrics-row">
            <div class="metric-box">
                <span id="accelLabel">Akselerasi (Δv/Δt)</span>
                <strong id="accelDisplay">0.0 km/j²</strong>
            </div>
            <div class="metric-box">
                <span id="predLabel">Prediksi 2 Detik</span>
                <strong id="predDisplay">0 km/j</strong>
            </div>
        </div>
    </div>

    <div class="glass-card control-group">
        <div class="control-header">
            <span id="limitTitle">Batas Kecepatan Maksimal</span>
            <span class="limit-badge"><span id="limitVal">70</span> <span id="limitUnit">km/j</span></span>
        </div>
        <input type="range" id="limitSlider" min="30" max="120" step="5" value="70">
        <div class="preset-btns">
            <button class="preset-btn" id="presetCity" onclick="setLimit(50)">Kota (50)</button>
            <button class="preset-btn" id="presetNormal" onclick="setLimit(70)">Normal (70)</button>
            <button class="preset-btn" id="presetHighway" onclick="setLimit(85)">Lintas (85)</button>
        </div>
    </div>

    <button class="btn btn-primary" id="toggleGpsBtn" onclick="toggleTracking()">
        ▶ Mulai AI + Munculkan Notifikasi
    </button>

    <button class="btn btn-ble" id="bleBtn" onclick="connectSmartwatch()">
        ⌚ Hubungkan Smartwatch (BLE)
    </button>

    <button class="btn btn-sim" id="simBtn" onclick="toggleSimulation()">
        🧪 Tes Simulasi Ngebut (Cek Notif & Suara)
    </button>

    <div class="log-box" id="logBox">
        [System] Tekan Mulai untuk mengizinkan notifikasi luar aplikasi.
    </div>
</div>

<script>
    // --- KAMUS BAHASA (INDONESIA CEWE & ENGLISH COWO) ---
    let currentLang = localStorage.getItem("vg_lang") || "id";
    let availableVoices = [];

    function muatDaftarSuara() {
        if ('speechSynthesis' in window) {
            availableVoices = window.speechSynthesis.getVoices();
        }
    }
    muatDaftarSuara();
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = muatDaftarSuara;
    }

    const I18N = {
        id: {
            ttsLocale: "id-ID",
            langBadge: "🌐 ID (♀)",
            unitBig: "KM / JAM",
            unitShort: "km/j",
            accelUnit: "km/j²",
            gpsStandby: "GPS Stand-by",
            gpsAccurate: (m) => `GPS Akurat (±${m}m)`,
            gpsWeak: "Sinyal GPS Lemah",
            aiReady: "AI Siap • Mode Mandiri",
            aiSafeWatch: "Terhubung Smartwatch • Aman",
            aiSafeSolo: "AI Aktif • Kecepatan Aman",
            aiNearLimit: (lim) => `Mendekati Batas (${lim} km/j)`,
            aiHighAccel: (pred) => `⚡ Gas Terlalu Cepat (Prediksi ${pred})`,
            aiOverSpeed: (lim) => `⚠️ OVER SPEED! (> ${lim} km/j)`,
            bgOff: "Notifikasi & Background: Off",
            bgOn: "Notifikasi Panel Atas & Background: AKTIF",
            accelLabel: "Akselerasi (Δv/Δt)",
            predLabel: "Prediksi 2 Detik",
            limitTitle: "Batas Kecepatan Maksimal",
            presetCity: "Kota (50)",
            presetNormal: "Normal (70)",
            presetHighway: "Lintas (85)",
            btnStart: "▶ Mulai AI + Munculkan Notifikasi",
            btnStop: "⏹ Hentikan Monitoring",
            btnBle: "⌚ Hubungkan Smartwatch (BLE)",
            btnBleConnected: (name) => `✅ Terhubung: ${name}`,
            btnSimStart: "🧪 Tes Simulasi Ngebut (Cek Notif & Suara)",
            btnSimStop: "⏹ Hentikan Simulasi",
            voiceLimitSet: (val) => `Batas kecepatan diatur ke ${val} kilometer per jam`,
            voiceActive: "Sistem AI peringatan kecepatan aktif.",
            voiceOverSpeed: (spd) => `Peringatan! Kecepatan ${spd} kilometer per jam, melewati batas!`,
            voiceHighAccel: (lim) => `Hati-hati, akselerasi tinggi, mendekati batas ${lim}`,
            voiceWatchConnected: "Smartwatch berhasil terhubung.",
            voiceWatchOver: (lim) => `Peringatan dari jam tangan! Kecepatan melewati batas ${lim}!`,
            voiceWatchWarn: "Hati-hati, kecepatan mulai tinggi.",
            voiceSimStart: "Memulai simulasi pengujian kecepatan.",
            notifActiveTitle: "⚡ VarioGuard AI Aktif",
            notifActiveBody: (lim) => `Memantau kecepatan (Batas: ${lim} km/j). Ketuk notifikasi ini untuk buka aplikasi.`,
            notifOverTitle: (spd) => `⚠️ OVER SPEED: ${spd} km/j!`,
            notifOverBody: (lim) => `Melewati batas aman ${lim} km/j. Ketuk untuk membuka VarioGuard AI.`,
            notifWatchTitle: "⚠️ SMARTWATCH ALERT!",
            notifWatchBody: (lim) => `Kecepatan melewati batas ${lim} km/j!`,
            mediaTitle: (spd, lim) => `Kecepatan: ${spd} km/j (Batas ${lim})`,
            mediaArtistOver: "⚠️ OVER SPEED! Tap untuk buka",
            mediaArtistSafe: "VarioGuard AI Aktif",
            mediaAlbumWatch: "Smartwatch Terhubung",
            mediaAlbumSolo: "Mode Mandiri",
            langChangedLog: "Bahasa diubah ke Indonesia (Suara Cewek)."
        },
        en: {
            ttsLocale: "en-US",
            langBadge: "🌐 EN (♂)",
            unitBig: "KM / H",
            unitShort: "km/h",
            accelUnit: "km/h²",
            gpsStandby: "GPS Stand-by",
            gpsAccurate: (m) => `GPS Locked (±${m}m)`,
            gpsWeak: "Weak GPS Signal",
            aiReady: "AI Ready • Standalone Mode",
            aiSafeWatch: "Smartwatch Linked • Safe",
            aiSafeSolo: "AI Active • Safe Speed",
            aiNearLimit: (lim) => `Approaching Limit (${lim} km/h)`,
            aiHighAccel: (pred) => `⚡ Rapid Acceleration (Pred. ${pred})`,
            aiOverSpeed: (lim) => `⚠️ OVER SPEED! (> ${lim} km/h)`,
            bgOff: "Notification & Background: Off",
            bgOn: "Top Bar Notification & Background: ACTIVE",
            accelLabel: "Acceleration (Δv/Δt)",
            predLabel: "2-Sec Prediction",
            limitTitle: "Maximum Speed Limit",
            presetCity: "City (50)",
            presetNormal: "Normal (70)",
            presetHighway: "Highway (85)",
            btnStart: "▶ Start AI + Enable Notification",
            btnStop: "⏹ Stop Monitoring",
            btnBle: "⌚ Connect Smartwatch (BLE)",
            btnBleConnected: (name) => `✅ Connected: ${name}`,
            btnSimStart: "🧪 Test Speed Simulation (Check Voice & Notif)",
            btnSimStop: "⏹ Stop Simulation",
            voiceLimitSet: (val) => `Speed limit set to ${val} kilometers per hour`,
            voiceActive: "AI speed alert system activated.",
            voiceOverSpeed: (spd) => `Warning! Speed is ${spd} kilometers per hour, exceeding the limit!`,
            voiceHighAccel: (lim) => `Caution, high acceleration, approaching ${lim} limit`,
            voiceWatchConnected: "Smartwatch successfully connected.",
            voiceWatchOver: (lim) => `Smartwatch alert! Speed exceeded ${lim} limit!`,
            voiceWatchWarn: "Caution, speed is getting high.",
            voiceSimStart: "Starting speed alert simulation.",
            notifActiveTitle: "⚡ VarioGuard AI Active",
            notifActiveBody: (lim) => `Monitoring speed (Limit: ${lim} km/h). Tap notification to open app.`,
            notifOverTitle: (spd) => `⚠️ OVER SPEED: ${spd} km/h!`,
            notifOverBody: (lim) => `Exceeded safe limit of ${lim} km/h. Tap to open VarioGuard AI.`,
            notifWatchTitle: "⚠️ SMARTWATCH ALERT!",
            notifWatchBody: (lim) => `Speed exceeded ${lim} km/h limit!`,
            mediaTitle: (spd, lim) => `Speed: ${spd} km/h (Limit ${lim})`,
            mediaArtistOver: "⚠️ OVER SPEED! Tap to open",
            mediaArtistSafe: "VarioGuard AI Active",
            mediaAlbumWatch: "Smartwatch Connected",
            mediaAlbumSolo: "Standalone Mode",
            langChangedLog: "Language switched to English (Male Voice)."
        }
    };

    function t() {
        return I18N[currentLang];
    }

    function applyLanguageUI() {
        const lang = t();
        document.documentElement.lang = currentLang;
        document.getElementById("langBtn").textContent = lang.langBadge;
        document.getElementById("unitLabel").textContent = lang.unitBig;
        document.getElementById("accelLabel").textContent = lang.accelLabel;
        document.getElementById("predLabel").textContent = lang.predLabel;
        document.getElementById("limitTitle").textContent = lang.limitTitle;
        document.getElementById("limitUnit").textContent = lang.unitShort;
        document.getElementById("presetCity").textContent = lang.presetCity;
        document.getElementById("presetNormal").textContent = lang.presetNormal;
        document.getElementById("presetHighway").textContent = lang.presetHighway;

        if (!isTracking) {
            gpsStatusText.textContent = lang.gpsStandby;
            toggleGpsBtn.innerHTML = lang.btnStart;
            aiStatusBadge.textContent = lang.aiReady;
        } else {
            toggleGpsBtn.innerHTML = lang.btnStop;
        }

        const bgText = document.getElementById("bgStatusText");
        bgText.textContent = (isTracking || simInterval) ? lang.bgOn : lang.bgOff;

        if (!watchConnected) {
            bleBtn.innerHTML = lang.btnBle;
        } else if (bleDevice) {
            bleBtn.innerHTML = lang.btnBleConnected(bleDevice.name || "Smartwatch");
        }

        document.getElementById("simBtn").textContent = simInterval ? lang.btnSimStop : lang.btnSimStart;
        accelDisplay.textContent = `0.0 ${lang.accelUnit}`;
        predDisplay.textContent = `0 ${lang.unitShort}`;
    }

    function toggleLanguage() {
        currentLang = currentLang === "id" ? "en" : "id";
        localStorage.setItem("vg_lang", currentLang);
        applyLanguageUI();
        addLog(t().langChangedLog);
        ucapkanSuara(currentLang === "id" ? "Bahasa Indonesia aktif." : "English male voice activated.", true);
    }

    // --- SPLASH / LOADING SCREEN ANIMATION ---
    window.addEventListener("DOMContentLoaded", () => {
        muatDaftarSuara();
        applyLanguageUI();
        const bar = document.getElementById("loaderBar");
        const sub = document.getElementById("loaderText");
        const screen = document.getElementById("loadingScreen");

        setTimeout(() => { bar.style.width = "40%"; sub.textContent = "Loading Predictive Engine..."; }, 250);
        setTimeout(() => { bar.style.width = "80%"; sub.textContent = "Calibrating Voice Profiles..."; }, 650);
        setTimeout(() => { bar.style.width = "100%"; sub.textContent = "Ready."; }, 1000);
        setTimeout(() => { screen.classList.add("hidden"); }, 1300);
    });

    // --- NOTIFIKASI SISTEM ANDROID ---
    let activeNotification = null;

    async function mintaIzinDanKirimNotif(judul, isi, tagNotif = "varioguard-status", getar = false) {
        if (!("Notification" in window)) return;

        if (Notification.permission === "default") {
            await Notification.requestPermission();
        }

        if (Notification.permission === "granted") {
            try {
                if (activeNotification && tagNotif === "varioguard-status") {
                    activeNotification.close();
                }

                const notif = new Notification(judul, {
                    body: isi,
                    tag: tagNotif,
                    renotify: getar,
                    requireInteraction: true,
                    silent: !getar
                });

                notif.onclick = function() {
                    window.focus();
                    this.close();
                };

                if (tagNotif === "varioguard-status") {
                    activeNotification = notif;
                }
            } catch (e) {}
        }
    }

    // --- SILENT AUDIO WAV + MEDIA SESSION ---
    function buatSilentAudioWav() {
        const buffer = new ArrayBuffer(44 + 8000);
        const view = new DataView(buffer);
        const writeStr = (offset, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };
        writeStr(0, 'RIFF');
        view.setUint32(4, 36 + 8000, true);
        writeStr(8, 'WAVE');
        writeStr(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, 8000, true);
        view.setUint32(28, 8000, true);
        view.setUint16(32, 1, true);
        view.setUint16(34, 8, true);
        writeStr(36, 'data');
        view.setUint32(40, 8000, true);
        for (let i = 44; i < 44 + 8000; i++) view.setUint8(i, 128);
        return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
    }

    const bgAudio = new Audio(buatSilentAudioWav());
    bgAudio.loop = true;

    function aktifkanBackgroundMode(aktif) {
        const lang = t();
        const bgText = document.getElementById("bgStatusText");
        if (aktif) {
            bgAudio.play().then(() => {
                bgText.textContent = lang.bgOn;
                bgText.style.color = "#00f59b";
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: lang.notifActiveTitle,
                        artist: lang.notifActiveBody(speedLimit),
                        album: lang.mediaAlbumSolo
                    });
                    navigator.mediaSession.playbackState = 'playing';
                }
                mintaIzinDanKirimNotif(
                    lang.notifActiveTitle,
                    lang.notifActiveBody(speedLimit),
                    "varioguard-status",
                    false
                );
            }).catch(() => {});
        } else {
            bgAudio.pause();
            if (activeNotification) activeNotification.close();
            bgText.textContent = lang.bgOff;
            bgText.style.color = "#60a5fa";
        }
    }

    // --- KONFIGURASI PROTOKOL BLE ---
    const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const NUS_RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const NUS_TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let bleRxCharacteristic = null;
    let watchConnected = false;

    let isTracking = false;
    let watchId = null;
    let wakeLock = null;
    let speedLimit = 70;

    let currentSpeed = 0;
    let prevSpeed = 0;
    let prevTimestamp = Date.now();
    let lastVoiceAlertTime = 0;
    let lastNotifAlertTime = 0;
    let simInterval = null;

    const speedDisplay = document.getElementById("speedDisplay");
    const accelDisplay = document.getElementById("accelDisplay");
    const predDisplay = document.getElementById("predDisplay");
    const aiStatusBadge = document.getElementById("aiStatusBadge");
    const speedCard = document.getElementById("speedCard");
    const limitSlider = document.getElementById("limitSlider");
    const limitVal = document.getElementById("limitVal");
    const toggleGpsBtn = document.getElementById("toggleGpsBtn");
    const gpsDot = document.getElementById("gpsDot");
    const gpsStatusText = document.getElementById("gpsStatusText");
    const bleBtn = document.getElementById("bleBtn");
    const logBox = document.getElementById("logBox");

    function addLog(msg) {
        const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
        logBox.innerHTML = `[${time}] ${msg}<br>` + logBox.innerHTML;
    }

    limitSlider.addEventListener("input", (e) => {
        speedLimit = parseInt(e.target.value);
        limitVal.textContent = speedLimit;
    });

    function setLimit(val) {
        speedLimit = val;
        limitSlider.value = val;
        limitVal.textContent = val;
        ucapkanSuara(t().voiceLimitSet(val), true);
        addLog(`Limit: ${val} ${t().unitShort}`);
    }

    // --- PEMILIH SUARA OTOMATIS (EN = COWO, ID = CEWE) ---
    function pilihSuaraSesuaiGender(utterance) {
        if (!availableVoices.length) {
            availableVoices = window.speechSynthesis.getVoices();
        }

        if (currentLang === "en") {
            // Cari suara Bahasa Inggris COWOK
            const enVoices = availableVoices.filter(v => v.lang.toLowerCase().startsWith("en"));
            const maleKeywords = ["male", "guy", "andrew", "brian", "christopher", "david", "mark", "james", "roger", "george", "daniel", "ryan", "rishi", "en-us-x-iol", "en-us-x-iom", "en-gb-x-gbd", "en-gb-x-rjs"];
            const femaleKeywords = ["female", "jenny", "aria", "sara", "zira", "samantha", "victoria", "karen", "moira", "tessa", "fiona", "en-us-x-sfg", "en-us-x-tpf", "en-gb-x-gba"];

            let chosen = enVoices.find(v => maleKeywords.some(k => v.name.toLowerCase().includes(k)));
            if (!chosen) {
                chosen = enVoices.find(v => !femaleKeywords.some(k => v.name.toLowerCase().includes(k)));
            }
            if (chosen) utterance.voice = chosen;
            utterance.pitch = 0.85; // Nada lebih berat/cowo
        } else {
            // Cari suara Bahasa Indonesia CEWEK
            const idVoices = availableVoices.filter(v => v.lang.toLowerCase().startsWith("id"));
            const femaleKeywords = ["female", "gadis", "google bahasa indonesia", "id-id-x-idc", "id-id-x-dfz", "damayanti"];
            const maleKeywords = ["male", "ardi", "id-id-x-idd"];

            let chosen = idVoices.find(v => femaleKeywords.some(k => v.name.toLowerCase().includes(k)));
            if (!chosen) {
                chosen = idVoices.find(v => !maleKeywords.some(k => v.name.toLowerCase().includes(k)));
            }
            if (chosen) utterance.voice = chosen;
            utterance.pitch = 1.08; // Nada natural cewek
        }
    }

    function ucapkanSuara(teks, paksa = false) {
        const now = Date.now();
        if (!paksa && (now - lastVoiceAlertTime < 5500)) return;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(teks);
            utterance.lang = t().ttsLocale;
            utterance.rate = 1.04;
            pilihSuaraSesuaiGender(utterance);
            window.speechSynthesis.speak(utterance);
            lastVoiceAlertTime = now;
        }
    }

    function prosesDataKecepatan(speedKmh) {
        const lang = t();
        const now = Date.now();
        const dt = Math.max(0.2, (now - prevTimestamp) / 1000);
        const accel = (speedKmh - prevSpeed) / dt;
        const predictedSpeed2s = Math.max(0, speedKmh + (accel * 2.0));

        prevSpeed = speedKmh;
        prevTimestamp = now;
        currentSpeed = Math.round(speedKmh);

        speedDisplay.textContent = currentSpeed;
        accelDisplay.textContent = `${accel.toFixed(1)} ${lang.accelUnit}`;
        predDisplay.textContent = `${Math.round(predictedSpeed2s)} ${lang.unitShort}`;

        if ('mediaSession' in navigator && (isTracking || simInterval)) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: lang.mediaTitle(currentSpeed, speedLimit),
                artist: currentSpeed > speedLimit ? lang.mediaArtistOver : lang.mediaArtistSafe,
                album: watchConnected ? lang.mediaAlbumWatch : lang.mediaAlbumSolo
            });
        }

        kirimKeSmartwatch(`SPD:${currentSpeed},LIM:${speedLimit}\n`);

        if (currentSpeed > speedLimit) {
            setVisualState("danger", lang.aiOverSpeed(speedLimit));
            ucapkanSuara(lang.voiceOverSpeed(currentSpeed));
            kirimKeSmartwatch("CMD:VIB_LONG\n");

            if (now - lastNotifAlertTime > 6000) {
                mintaIzinDanKirimNotif(
                    lang.notifOverTitle(currentSpeed),
                    lang.notifOverBody(speedLimit),
                    "varioguard-alert",
                    true
                );
                lastNotifAlertTime = now;
            }
        } else if (predictedSpeed2s > speedLimit && accel > 3.5 && currentSpeed > (speedLimit * 0.75)) {
            setVisualState("warn", lang.aiHighAccel(Math.round(predictedSpeed2s)));
            ucapkanSuara(lang.voiceHighAccel(speedLimit));
            kirimKeSmartwatch("CMD:VIB_SHORT\n");
        } else if (currentSpeed >= speedLimit - 5) {
            setVisualState("warn", lang.aiNearLimit(speedLimit));
        } else {
            setVisualState("safe", watchConnected ? lang.aiSafeWatch : lang.aiSafeSolo);
        }
    }

    function setVisualState(state, badgeText) {
        speedCard.className = `glass-card speed-card state-${state}`;
        aiStatusBadge.textContent = badgeText;

        if (state === "danger") {
            speedDisplay.style.color = "var(--danger-color)";
            aiStatusBadge.style.background = "rgba(255, 42, 85, 0.18)";
            aiStatusBadge.style.color = "var(--danger-color)";
        } else if (state === "warn") {
            speedDisplay.style.color = "var(--warn-color)";
            aiStatusBadge.style.background = "rgba(255, 184, 0, 0.18)";
            aiStatusBadge.style.color = "var(--warn-color)";
        } else {
            speedDisplay.style.color = "var(--safe-color)";
            aiStatusBadge.style.background = "rgba(0, 245, 155, 0.12)";
            aiStatusBadge.style.color = "var(--safe-color)";
        }
    }

    async function toggleTracking() {
        const lang = t();
        if (!isTracking) {
            if (!("geolocation" in navigator)) {
                alert("GPS not supported.");
                return;
            }

            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {}

            aktifkanBackgroundMode(true);
            ucapkanSuara(lang.voiceActive, true);

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    gpsDot.classList.add("active");
                    gpsStatusText.textContent = t().gpsAccurate(Math.round(pos.coords.accuracy));
                    const speedMs = pos.coords.speed || 0;
                    prosesDataKecepatan(speedMs * 3.6);
                },
                (err) => {
                    gpsStatusText.textContent = t().gpsWeak;
                    addLog(`GPS: ${err.message}`);
                },
                { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
            );

            isTracking = true;
            toggleGpsBtn.className = "btn btn-stop";
            toggleGpsBtn.innerHTML = lang.btnStop;
            addLog("Monitoring started.");
        } else {
            navigator.geolocation.clearWatch(watchId);
            if (wakeLock) wakeLock.release();
            aktifkanBackgroundMode(false);
            isTracking = false;
            gpsDot.classList.remove("active");
            gpsStatusText.textContent = lang.gpsStandby;
            toggleGpsBtn.className = "btn btn-primary";
            toggleGpsBtn.innerHTML = lang.btnStart;
            prosesDataKecepatan(0);
            addLog("Monitoring stopped.");
        }
    }

    async function connectSmartwatch() {
        const lang = t();
        if (!navigator.bluetooth) {
            alert("Web Bluetooth requires Chrome Android over HTTPS.");
            return;
        }

        try {
            addLog("Scanning Smartwatch BLE...");
            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [NUS_SERVICE_UUID]
            });

            bleDevice.addEventListener('gattserverdisconnected', () => {
                watchConnected = false;
                bleBtn.innerHTML = t().btnBle;
                addLog("Smartwatch disconnected.");
            });

            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(NUS_SERVICE_UUID);
            bleRxCharacteristic = await service.getCharacteristic(NUS_RX_CHAR_UUID);
            const txCharacteristic = await service.getCharacteristic(NUS_TX_CHAR_UUID);

            await txCharacteristic.startNotifications();
            txCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                const value = new TextDecoder().decode(event.target.value).trim();
                addLog(`Watch: ${value}`);
                if (value === "ALERT:OVER") {
                    ucapkanSuara(t().voiceWatchOver(speedLimit), true);
                    mintaIzinDanKirimNotif(t().notifWatchTitle, t().notifWatchBody(speedLimit), "varioguard-alert", true);
                } else if (value === "ALERT:WARN") {
                    ucapkanSuara(t().voiceWatchWarn, true);
                }
            });

            watchConnected = true;
            bleBtn.innerHTML = lang.btnBleConnected(bleDevice.name || "Smartwatch");
            ucapkanSuara(lang.voiceWatchConnected, true);
            addLog(`Connected: ${bleDevice.name}`);
        } catch (error) {
            addLog(`BLE: ${error.message}`);
        }
    }

    async function kirimKeSmartwatch(dataStr) {
        if (watchConnected && bleRxCharacteristic) {
            try {
                const encoder = new TextEncoder();
                await bleRxCharacteristic.writeValueWithoutResponse(encoder.encode(dataStr));
            } catch (e) {}
        }
    }

    function toggleSimulation() {
        const lang = t();
        if (simInterval) {
            clearInterval(simInterval);
            simInterval = null;
            aktifkanBackgroundMode(false);
            document.getElementById("simBtn").textContent = lang.btnSimStart;
            prosesDataKecepatan(0);
            addLog("Simulation stopped.");
            return;
        }

        aktifkanBackgroundMode(true);
        ucapkanSuara(lang.voiceSimStart, true);
        document.getElementById("simBtn").textContent = lang.btnSimStop;
        addLog("Simulation running...");
        let simSpeed = 20;

        simInterval = setInterval(() => {
            simSpeed += 9;
            if (simSpeed > 95) simSpeed = 25;
            prosesDataKecepatan(simSpeed);
        }, 1000);
    }
</script>
